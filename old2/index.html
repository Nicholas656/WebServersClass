<!DOCTYPE html>
<html>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
    <head>
        <style>
            html, body, div{
                margin: 0;
                padding: 0;
                border: 0;
                outline: 0;
                font-size: 100%;
                vertical-align: baseline;
                background: transparent;
            }
            .sidenav {
                width: 15%;
                height: 100%;
                background-color: #000000;
                float: left;
                margin-top: auto;
            }
            th, td {
                border:1px solid white;
                box-shadow: 1 1 3px white;
                color: white;
            }
            table {
                border-color: #FFFFFF;
                box-shadow: 0 0 3px white;
                color: white;
            }
            tbody tr:hover td{
                border-color: magenta;
                box-shadow: 0px 1px 15px magenta;
            }
            tbody tr:hover {
                border-color: magenta;
                box-shadow: 0px 1px 15px magenta;
            }
            .bgrnd {
              width: 85%;
              height: 100%;
              background-color: #222222;
              float: left;
            }
            html,
            body {
                height: 100%;
            }
            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                width: 100%;
                background-color: #000000;
            }

            li a {
              display: block;
              color: white;
              padding: 8px 16px;
              text-decoration: none;
            }

            li a.active {
              background-color: #00AA00;
              color: white;
            }

            li a:hover:not(.active) {
              background-color: #555555;
              color: white;
            }
        </style>
        <script>
            jQuery(document).ready(function($) {
            $(".clickable-row").click(function() {
                window.location = $(this).data("href");
            });
        });
        </script>
    </head>
    <title>Panel</title>
    <body style="padding: 0;">
        <div class="sidenav">
            <div style="height: 10px;"></div>
            <div style="width: 100%; height: 200px;">
                <img src="img/banner.jpg" style="height: 200px; width: 200px; display: block;  margin-left: auto; margin-right: auto;"/>
            </div>
            <ul>
                <li><a class="active" href="#home">Overview</a></li>
                <li><a href="#Detailed">Detail</a></li>
                <li><a href="#about">Add Client</a></li>
              </ul>              
        </div>
        <div class="bgrnd">
            <table style="width: 100%;">
                <tr>
                    <th style="width: 150px;">Client ID</th>
                    <th style="width: 100px;">Country</th>
                    <th>Client Name</th>
                    <th>Operating System</th>
                    <th>Last Contact</th>
                    <th>Uptime</th>
                </tr>
                <tbody class='clickable-row' data-href='#1'> <!-- Pass to php via ?ID=#### -->
                    <td>1</td>
                    <td>CA</td>
                    <td>Machine 1</td>
                    <td>Windows</td>
                    <td>2013-10-01 18:00</td>
                    <td>1:00:12:30</td>
                </tbody>
                <tbody class='clickable-row' data-href='#2'>
                    <td>2</td>
                    <td>US</td>
                    <td>Machine 2</td>
                    <td>Windows</td>
                    <td>2019-05-01 12:00</td>
                    <td>1:00:12:30</td>
                </tbody>
            </table>
        </div>
    </body>
